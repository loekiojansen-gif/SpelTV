<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Vibrant Lime Background matching header top-left icon -->
  <rect width="512" height="512" rx="112" fill="#a3e635"/>
  
  <!-- Subtle dark inner border for crisp definition -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#051710" stroke-width="6" opacity="0.15"/>

  <!-- Putting Green Ground -->
  <ellipse cx="256" cy="384" rx="155" ry="48" fill="#15803d"/>
  <ellipse cx="256" cy="384" rx="135" ry="38" fill="#16a34a"/>
  
  <!-- Hole Cup -->
  <ellipse cx="226" cy="388" rx="34" ry="14" fill="#061a12"/>
  <ellipse cx="226" cy="388" rx="26" ry="9" fill="#000000"/>
  
  <!-- Golf Flag Pole (Bold Dark) -->
  <rect x="221" y="115" width="10" height="273" rx="5" fill="#061a12"/>
  
  <!-- Flag Pin Top Ball (Gold) -->
  <circle cx="226" cy="110" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
  
  <!-- Vibrant Triangular Red Golf Flag (⛳) -->
  <path d="M 231 120 L 370 185 L 231 250 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
  <!-- Flag Highlight Shading -->
  <path d="M 231 120 L 320 162 L 231 200 Z" fill="#f87171" opacity="0.4"/>
  
  <!-- Golf Ball (White) -->
  <circle cx="316" cy="388" r="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5"/>
  <circle cx="314" cy="385" r="4" fill="#e2e8f0"/>
</svg>
